- hosts: swissbank
  become: yes
  tasks:
    - name: Set a hostname
      hostname:
        name: swissbank
    - name: Generate locale
      locale_gen:
        name: en_US.UTF-8
        state: present
    - name: Set default locale
      command: localectl set-locale LANG=en_US.UTF-8
    - name: Update packages
      apt:
        update_cache: yes
        upgrade: full
    - name: Install dependencies
      apt:
        name:
          - git
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - vim
        state: present
    - name: Install Docker using official convenience script
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker # prevents re-running if already installed

    - name: Add heeckhau user to docker group
      user:
        name: heeckhau
        groups: docker
        append: yes

    - name: Install additional packages
      apt:
        name:
          - uidmap
          - chromium-browser
          - ufw
        state: present
        update_cache: yes
    - name: Allow HTTPS traffic through firewall
      ufw:
        rule: allow
        port: "443"
        proto: tcp
    - name: Clone TLSNotary demo
      become: true
      become_user: heeckhau
      git:
        repo: https://github.com/tlsnotary/devconnect25_demo.git
        dest: /home/heeckhau/devconnect25_demo
        version: dev
        force: yes
    - name: Copy certs folder to demo directory
      become: true
      become_user: heeckhau
      copy:
        src: certs/
        dest: /home/heeckhau/devconnect25_demo/devops/certs/
        mode: preserve
    - name: Enable Docker service
      systemd:
        name: docker
        enabled: yes
        state: started
    - name: Build Docker images for swissbank
      become: true
      become_user: heeckhau
      shell: docker compose build
      args:
        chdir: /home/heeckhau/devconnect25_demo/swissbank
    - name: Run swissbank containers
      become: true
      become_user: heeckhau
      shell: docker compose up -d
      args:
        chdir: /home/heeckhau/devconnect25_demo/swissbank
    - name: Create autostart directory
      become: true
      become_user: heeckhau
      file:
        path: /home/heeckhau/.config/autostart
        state: directory
        mode: "0755"
    - name: Create Chromium kiosk autostart entry
      become: true
      become_user: heeckhau
      copy:
        dest: /home/heeckhau/.config/autostart/chromium.desktop
        content: |
          [Desktop Entry]
          Type=Application
          Exec=chromium-browser --password-store=basic --noerrdialogs --disable-infobars --kiosk https://swissbank.tlsnotary.org/dashboard
          Hidden=false
          X-GNOME-Autostart-enabled=true
          Name=Chromium Kiosk
        mode: "0644"
