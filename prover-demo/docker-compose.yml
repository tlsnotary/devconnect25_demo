services:
  # Backend service (prover server)
  prover-server:
    build: ./server
    ports:
      - "9816:9816" # WebSocket server port (HTTP)
      # - "55688:55688" # no required for demo
    restart: unless-stopped
    container_name: prover-server
    environment:
      - RUST_LOG=info

  # Frontend service (verifier webapp)
  verifier-webapp:
    build:
      context: ./webapp
      args:
        PROVER_PROXY_URL: wss://test.tlsnotary.org:8443/prove
    restart: unless-stopped
    ports:
      - "80:80"
    container_name: verifier-webapp
    depends_on:
      - prover-server
    environment:
      - RUST_LOG=info

  # Nginx proxy for local testing (HTTPS + WebSocket proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../devops/certs:/etc/nginx/ssl:ro
    depends_on:
      - verifier-webapp
      - prover-server
    restart: unless-stopped
    container_name: prover-nginx
